<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunox — мессенджер нового поколения</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a0f2e;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    max-width: 600px;
    text-align: center;
    background: rgba(139, 92, 246, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 20px;
    padding: 60px 40px;
    backdrop-filter: blur(20px);
  }
  .logo {
    font-size: 64px;
    color: #a78bfa;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 42px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #a78bfa, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p {
    font-size: 18px;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 40px;
  }
  .btn {
    display: inline-block;
    padding: 16px 32px;
    background: linear-gradient(135deg, #7c3aed, #a78bfa);
    color: #fff;
    text-decoration: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .btn:active { transform: scale(0.96); }
  .links {
    margin-top: 40px;
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .links a {
    color: rgba(255, 255, 255, 0.5);
    text-decoration: none;
    font-size: 14px;
    transition: color 0.2s;
  }
  .links a:hover { color: #a78bfa; }
</style>
</head>
<body>
  <div class="container">
    <div class="logo">☾</div>
    <h1>Lunox</h1>
    <p>Мессенджер нового поколения. Чаты, звонки, ИИ. Без рекламы.</p>
    <a href="https://lunoxapp.online" class="btn">Открыть Lunox</a>
    <div class="links">
      <a href="https://tiktok.com/@lunox.app">TikTok</a>
      <a href="https://youtube.com/@LunoxApp">YouTube</a>
      <a href="https://t.me/lunox_channel">Telegram</a>
    </div>
  </div>
</body>
</html>
