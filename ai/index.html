<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunox AI — чат</title>
<!--
  ============================================================
  Lunox AI — одностраничный AI-чат (только вёрстка, без JS)
  ------------------------------------------------------------
  Что нужно дописать на JS (помечено комментариями [JS]):
  1. Авто-высота textarea (сейчас rows="1", фикс. min/max-height).
  2. Переключение кнопок «Отправить» ↔ «Стоп» (класс .is-hidden).
  3. Показ/скрытие экрана приветствия (.welcome) и ленты (.messages).
  4. Показ индикатора «печатает» (.typing) во время генерации.
  5. Копирование ответа (кнопки .msg-action).
  6. Очистка истории, сохранение API-ключа, реальные запросы.
  ------------------------------------------------------------
  Уже работает без JS:
  • Выбор модели — bottom sheet (JS); старые таблетки скрыты (.pill--hidden).
  • Модальное окно настроек — на checkbox (label[for]).
  ============================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:            #0f0f0f;
    --surface:       #1a1a1a;
    --surface-2:     #222225;
    --glass:         rgba(255,255,255,.045);
    --glass-strong:  rgba(255,255,255,.07);
    --border:        rgba(255,255,255,.08);
    --border-strong: rgba(255,255,255,.16);
    --text:          #ececf1;
    --text-2:        #a1a1aa;
    --text-3:        #6b6b74;
    --accent:        #7c3aed;
    --accent-2:      #a78bfa;
    --accent-soft:   rgba(124,58,237,.14);
    --accent-border: rgba(167,139,250,.35);
    --radius-lg:     20px;
    --radius-md:     16px;
    --grad:          linear-gradient(135deg,#7c3aed 0%,#a78bfa 100%);
    --grad-soft:     linear-gradient(135deg,rgba(124,58,237,.32),rgba(167,139,250,.16));
    --content-w:     760px;
    --ease:          cubic-bezier(.22,.8,.3,1);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  /* Без синих вспышек при тапе (Android/Chrome); кольцо фокуса — только для клавиатуры */
  *{ -webkit-tap-highlight-color:transparent; }
  button, a, [role="button"]{ -webkit-tap-highlight-color:transparent; }
  button:focus, a:focus, [role="button"]:focus{ outline:none; }
  button:focus-visible, a:focus-visible, [role="button"]:focus-visible{ outline:none; box-shadow:0 0 0 2px rgba(124,58,237,.4); }
  .send-btn:focus-visible{ box-shadow:0 0 0 2px rgba(124,58,237,.4), 0 4px 14px rgba(124,58,237,.35); }
  .btn-primary:focus-visible{ box-shadow:0 0 0 2px rgba(124,58,237,.4), 0 4px 14px rgba(124,58,237,.30); }
  html,body{ height:100%; }

  body{
    font-family:'Inter',-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* Тонкое фиолетовое свечение фона */
  body::before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(600px 300px at 50% -10%, rgba(124,58,237,.10), transparent 70%),
      radial-gradient(500px 260px at 85% 110%, rgba(124,58,237,.06), transparent 70%);
    pointer-events:none;
    z-index:0;
  }

  ::selection{ background:rgba(124,58,237,.4); }

  .is-hidden{ display:none !important; }

  /* Блоки кода в ответах ИИ (новые элементы, существующий визуал не затронут) */
  .bubble pre{ margin:10px 0 2px; padding:12px 14px; background:var(--bg); border:1px solid var(--border); border-radius:12px; overflow-x:auto; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:pre; }
  .bubble pre:first-child{ margin-top:0; }
  .bubble pre + p{ margin-top:10px; }
  .bubble pre code{ font:inherit; }

  .visually-hidden{
    position:absolute; width:1px; height:1px;
    clip-path:inset(50%); overflow:hidden; white-space:nowrap;
  }

  /* ============================== КАРКАС ============================== */
  .app{
    position:relative; z-index:1;
    height:100dvh;
    display:flex; flex-direction:column;
  }

  /* ============================== ШАПКА ============================== */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px;
    padding:12px 20px;
    border-bottom:1px solid var(--border);
    background:rgba(15,15,15,.75);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }

  .brand{ display:flex; align-items:center; gap:11px; text-decoration:none; color:inherit; }
  .brand-mark{
    width:34px; height:34px; flex:none;
    display:grid; place-items:center;
    background:var(--grad);
    border-radius:11px;
    box-shadow:0 4px 16px rgba(124,58,237,.35);
    color:#fff;
  }
  .brand-mark svg{ width:18px; height:18px; }
  .brand-name{ font-weight:600; font-size:16px; letter-spacing:.2px; }
  .brand-name span{ color:var(--accent-2); }

  .topbar-actions{ display:flex; align-items:center; gap:8px; }

  .icon-btn{
    width:37px; height:37px; flex:none;
    display:grid; place-items:center;
    background:transparent;
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--text-2);
    cursor:pointer;
    transition:background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease), transform .15s var(--ease);
  }
  .icon-btn:hover{ background:var(--glass-strong); color:var(--text); border-color:var(--border-strong); }
  .icon-btn:active{ transform:scale(.94); }
  .icon-btn svg{ width:17px; height:17px; }
  .icon-btn.danger:hover{ color:#f87171; border-color:rgba(248,113,113,.35); background:rgba(248,113,113,.08); }

  .btn-primary{
    display:inline-flex; align-items:center; gap:8px;
    height:37px; padding:0 16px;
    font:inherit; font-weight:500; font-size:14px;
    color:#fff;
    background:var(--grad);
    border:none; border-radius:12px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(124,58,237,.30);
    transition:filter .2s var(--ease), box-shadow .2s var(--ease), transform .15s var(--ease);
  }
  .btn-primary:hover{ filter:brightness(1.12); box-shadow:0 6px 20px rgba(124,58,237,.42); }
  .btn-primary:active{ transform:scale(.97); }
  .btn-primary svg{ width:15px; height:15px; }

  /* ====================== ВЫБОР МОДЕЛИ (таблетки) ====================== */
  .model-bar{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:12px 20px 4px;
    max-width:var(--content-w);
    width:100%;
    margin:0 auto;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .model-bar::-webkit-scrollbar{ display:none; }

  .model-bar input{ position:absolute; opacity:0; pointer-events:none; }

  .model-pill{
    display:inline-flex; align-items:center; gap:7px;
    padding:7px 15px;
    font-size:13.5px; font-weight:500;
    color:var(--text-2);
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    user-select:none;
    transition:all .2s var(--ease);
  }
  .model-pill::before{
    content:"";
    width:6px; height:6px; border-radius:50%;
    background:var(--text-3);
    transition:all .2s var(--ease);
  }
  .model-pill:hover{ color:var(--text); border-color:var(--border-strong); background:var(--glass-strong); }
  .model-bar input:checked + .model-pill{
    color:var(--accent-2);
    background:var(--accent-soft);
    border-color:var(--accent-border);
  }
  .model-bar input:checked + .model-pill::before{
    background:var(--accent-2);
    box-shadow:0 0 8px rgba(167,139,250,.8);
  }
  .model-bar input:focus-visible + .model-pill{ outline:2px solid var(--accent-2); outline-offset:2px; }

  /* Старые таблетки остаются в HTML «на будущее», но не показываются */
  .pill--hidden{ display:none; }
  .brand--hidden{ display:none; }

  /* ====================== КНОПКА ВЫБОРА МОДЕЛИ ====================== */
  .model-picker{
    display:inline-flex; align-items:center; gap:8px;
    min-width:0; height:37px; padding:0 12px 0 14px;
    font:inherit; font-size:14px; font-weight:500; color:var(--text);
    background:var(--glass);
    border:1px solid var(--border); border-radius:12px;
    cursor:pointer;
    transition:background .2s var(--ease), border-color .2s var(--ease), transform .15s var(--ease);
  }
  .model-picker:hover{ background:var(--glass-strong); border-color:var(--border-strong); }
  .model-picker:active{ transform:scale(.97); }
  .model-picker-name{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .model-picker svg{ width:16px; height:16px; flex:none; color:var(--text-2); transition:transform .3s var(--ease); }
  .model-picker[aria-expanded="true"] svg{ transform:rotate(180deg); }
  .topbar-actions{ flex:none; }

  /* ====================== BOTTOM SHEET: ВЫБОР МОДЕЛИ ====================== */
  .sheet{ position:fixed; inset:0; z-index:60; visibility:hidden; pointer-events:none; transition:visibility 0s linear .4s; }
  .sheet.is-open{ visibility:visible; pointer-events:auto; transition-delay:0s; }
  .sheet-overlay{ position:absolute; inset:0; background:rgba(0,0,0,.6); opacity:0; touch-action:none; transition:opacity .4s cubic-bezier(.16,1,.3,1); }
  .sheet.is-open .sheet-overlay{ opacity:1; }

  .sheet-panel{
    position:absolute; left:0; right:0; bottom:var(--kb,0px);
    width:100%; max-width:560px; margin:0 auto;
    max-height:min(82dvh, 680px, calc(var(--vvh,100dvh) - 16px));
    display:flex; flex-direction:column;
    background:#1a1a1a;
    border:1px solid var(--border-strong); border-bottom:none;
    border-radius:20px 20px 0 0;
    padding-bottom:env(safe-area-inset-bottom,0px);
    box-shadow:0 -12px 50px rgba(0,0,0,.5);
    transform:translateY(100%);
    transition:transform .4s cubic-bezier(.16,1,.3,1);
    outline:none;
  }
  .sheet.is-open .sheet-panel{ transform:translateY(0); }
  .sheet-panel.is-dragging{ transition:none; }

  .sheet-drag{ flex:none; touch-action:none; }
  .sheet-handle{ display:block; width:40px; height:4px; margin:10px auto 6px; border-radius:2px; background:rgba(255,255,255,.22); }
  .sheet-title{ font-size:17px; font-weight:600; padding:4px 20px 12px; }
  .sheet-search{ flex:none; margin:0 16px 12px; }
  .sheet-search input{ -webkit-appearance:none; appearance:none; }

  .sheet-list{
    flex:1 1 auto; min-height:0;
    list-style:none;
    display:flex; flex-direction:column; gap:8px;
    padding:0 16px 16px;
    overflow-y:auto; overscroll-behavior:contain;
    scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.14) transparent;
  }
  .model-card{
    width:100%;
    display:flex; align-items:center; gap:12px;
    padding:12px 14px; text-align:left;
    font:inherit; color:var(--text);
    background:var(--glass);
    border:1px solid var(--border); border-radius:14px;
    cursor:pointer;
    transition:background .2s var(--ease), border-color .2s var(--ease), transform .15s var(--ease);
  }
  .model-card:hover{ background:var(--glass-strong); border-color:var(--border-strong); }
  .model-card:active{ transform:scale(.985); }
  .model-card[aria-selected="true"]{ background:var(--accent-soft); border-color:#7c3aed; }
  .model-card-text{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .model-card-name{ font-size:15px; font-weight:500; }
  .model-card-desc{ font-size:12.5px; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .model-card-check{
    width:22px; height:22px; flex:none;
    display:grid; place-items:center;
    border-radius:50%; background:#7c3aed; color:#fff;
    opacity:0; transform:scale(.6);
    transition:opacity .2s var(--ease), transform .25s var(--ease);
  }
  .model-card-check svg{ width:13px; height:13px; }
  .model-card[aria-selected="true"] .model-card-check{ opacity:1; transform:scale(1); }
  .sheet-empty{ padding:28px 0; text-align:center; font-size:13.5px; color:var(--text-3); }

  /* ============================== ЧАТ ============================== */
  .chat{
    flex:1;
    overflow-y:auto;
    scroll-behavior:smooth;
    padding:20px 20px 28px;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,255,255,.14) transparent;
  }
  .chat::-webkit-scrollbar{ width:6px; }
  .chat::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.14); border-radius:3px; }
  .chat::-webkit-scrollbar-track{ background:transparent; }

  /* ---------- Приветствие (пустой чат) ---------- */
  .welcome{
    max-width:var(--content-w);
    margin:0 auto;
    min-height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    padding:24px 0 8px;
    animation:msg-in .5s var(--ease) both;
  }
  .welcome-logo{
    width:68px; height:68px;
    display:grid; place-items:center;
    background:var(--grad);
    border-radius:20px;
    box-shadow:0 10px 34px rgba(124,58,237,.40);
    color:#fff;
    margin-bottom:22px;
  }
  .welcome-logo svg{ width:34px; height:34px; }
  .welcome h1{
    font-size:27px; font-weight:600; letter-spacing:-.3px;
    margin-bottom:8px;
  }
  .welcome h1 em{
    font-style:normal;
    background:var(--grad);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .welcome-sub{ color:var(--text-2); font-size:14.5px; margin-bottom:30px; max-width:420px; }

  .quick-prompts{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    width:100%;
    max-width:600px;
  }
  .quick-btn{
    display:flex; align-items:flex-start; gap:12px;
    padding:14px 16px;
    text-align:left;
    font:inherit;
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    color:var(--text);
    cursor:pointer;
    transition:all .2s var(--ease);
  }
  .quick-btn:hover{
    background:var(--accent-soft);
    border-color:var(--accent-border);
    transform:translateY(-2px);
  }
  .quick-btn svg{ width:17px; height:17px; flex:none; margin-top:2px; color:var(--accent-2); }
  .quick-btn b{ display:block; font-weight:500; font-size:14px; margin-bottom:2px; }
  .quick-btn small{ display:block; font-size:12.5px; color:var(--text-2); line-height:1.4; }

  /* ---------- Лента сообщений ---------- */
  .messages{
    max-width:var(--content-w);
    margin:0 auto;
    display:flex; flex-direction:column;
    gap:22px;
  }

  .msg{ display:flex; gap:12px; animation:msg-in .38s var(--ease) both; }
  .msg:nth-child(2){ animation-delay:.06s; }
  .msg:nth-child(3){ animation-delay:.12s; }
  .msg:nth-child(4){ animation-delay:.18s; }

  @keyframes msg-in{
    from{ opacity:0; transform:translateY(10px); }
    to  { opacity:1; transform:translateY(0); }
  }

  .msg-avatar{
    width:30px; height:30px; flex:none;
    display:grid; place-items:center;
    background:var(--grad);
    border-radius:10px;
    color:#fff;
    margin-top:2px;
  }
  .msg-avatar svg{ width:15px; height:15px; }

  .msg-body{ min-width:0; display:flex; flex-direction:column; gap:6px; }

  .msg-meta{
    display:flex; align-items:center; gap:8px;
    font-size:12px; color:var(--text-3);
  }
  .msg-meta b{ color:var(--text-2); font-weight:500; }

  .bubble{
    padding:12px 16px;
    border-radius:var(--radius-lg);
    font-size:14.5px;
    overflow-wrap:anywhere;
  }

  /* Ответ ИИ — слева, стекло */
  .msg.ai .bubble{
    background:var(--glass);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--border);
    border-top-left-radius:6px;
    color:var(--text);
  }
  .msg.ai .bubble p + p{ margin-top:10px; }

  /* Сообщение пользователя — справа, градиент */
  .msg.user{ justify-content:flex-end; }
  .msg.user .msg-body{ align-items:flex-end; max-width:78%; }
  .msg.user .bubble{
    background:var(--grad-soft);
    border:1px solid var(--accent-border);
    border-bottom-right-radius:6px;
    color:#f3efff;
  }

  /* Действия под ответом ИИ (копировать и т.п.) */
  .msg-actions{
    display:flex; gap:4px;
    opacity:0;
    transition:opacity .2s var(--ease);
  }
  .msg:hover .msg-actions{ opacity:1; }
  .msg-action{
    display:inline-flex; align-items:center; gap:6px;
    padding:5px 9px;
    font:inherit; font-size:12px;
    color:var(--text-3);
    background:transparent;
    border:none; border-radius:8px;
    cursor:pointer;
    transition:all .18s var(--ease);
  }
  .msg-action:hover{ color:var(--text); background:var(--glass-strong); }
  .msg-action svg{ width:13.5px; height:13.5px; }

  /* ---------- Индикатор «печатает…» ---------- */
  .typing{
    display:inline-flex; align-items:center; gap:10px;
    padding:13px 18px;
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    border-top-left-radius:6px;
    width:fit-content;
  }
  .typing-dots{ display:flex; gap:5px; }
  .typing-dots i{
    width:7px; height:7px; border-radius:50%;
    background:var(--accent-2);
    animation:pulse-dot 1.2s ease-in-out infinite;
  }
  .typing-dots i:nth-child(2){ animation-delay:.15s; }
  .typing-dots i:nth-child(3){ animation-delay:.3s; }
  .typing-text{ font-size:13px; color:var(--text-3); animation:pulse-text 1.6s ease-in-out infinite; }

  @keyframes pulse-dot{
    0%,60%,100%{ opacity:.3; transform:translateY(0); }
    30%{ opacity:1; transform:translateY(-3px); }
  }
  @keyframes pulse-text{ 0%,100%{opacity:.55;} 50%{opacity:1;} }

  /* ============================== ВВОД ============================== */
  .composer{
    padding:10px 20px 14px;
    background:linear-gradient(to top, var(--bg) 55%, transparent);
  }
  .composer-inner{ max-width:var(--content-w); margin:0 auto; }

  .composer-box{
    display:flex; align-items:flex-end; gap:10px;
    padding:10px 10px 10px 18px;
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-radius:var(--radius-lg);
    box-shadow:0 8px 30px rgba(0,0,0,.35);
    transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .composer-box:focus-within{
    border-color:var(--accent-border);
    box-shadow:0 0 0 3px rgba(124,58,237,.15), 0 8px 30px rgba(0,0,0,.35);
  }

  .composer-box textarea{
    flex:1;
    background:transparent;
    border:none; outline:none; resize:none;
    font:inherit; font-size:15px; line-height:1.5;
    color:var(--text);
    min-height:24px; max-height:180px;   /* [JS] авто-высота: пересчитывать height по scrollHeight */
    padding:5px 0;
  }
  .composer-box textarea::placeholder{ color:var(--text-3); }

  .composer-actions{ display:flex; align-items:center; gap:8px; }

  .send-btn{
    width:40px; height:40px; flex:none;
    display:grid; place-items:center;
    background:var(--grad);
    border:none; border-radius:14px;
    color:#fff; cursor:pointer;
    box-shadow:0 4px 14px rgba(124,58,237,.35);
    transition:filter .2s var(--ease), box-shadow .2s var(--ease), transform .15s var(--ease);
  }
  .send-btn:hover{ filter:brightness(1.12); box-shadow:0 6px 20px rgba(124,58,237,.5); transform:translateY(-1px); }
  .send-btn:active{ transform:scale(.93); }
  .send-btn svg{ width:17px; height:17px; }

  /* Кнопка «Стоп» — показывать во время генерации, .send-btn при этом скрывать */
  .stop-btn{
    width:40px; height:40px; flex:none;
    display:grid; place-items:center;
    background:var(--glass-strong);
    border:1px solid var(--border-strong);
    border-radius:14px;
    color:var(--text); cursor:pointer;
    transition:all .2s var(--ease);
  }
  .stop-btn:hover{ background:rgba(248,113,113,.12); border-color:rgba(248,113,113,.4); color:#f87171; }
  .stop-btn:active{ transform:scale(.93); }
  .stop-btn svg{ width:15px; height:15px; }

  .composer-hint{
    text-align:center;
    font-size:12px;
    color:var(--text-3);
    margin-top:9px;
  }

  /* ====================== МОДАЛКА НАСТРОЕК (без JS) ====================== */
  .modal{ position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:20px;
    visibility:hidden; opacity:0; transition:opacity .25s var(--ease), visibility .25s; }
  .modal-overlay{ position:absolute; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(6px); cursor:pointer; }

  .modal-card{
    position:relative;
    width:100%; max-width:420px;
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-radius:var(--radius-lg);
    padding:22px;
    box-shadow:0 24px 70px rgba(0,0,0,.55);
    transform:translateY(12px) scale(.98);
    transition:transform .25s var(--ease);
  }
  #settings-toggle:checked ~ .modal{ visibility:visible; opacity:1; }
  #settings-toggle:checked ~ .modal .modal-card{ transform:translateY(0) scale(1); }

  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .modal-head h2{ font-size:17px; font-weight:600; }

  .field-label{ display:block; font-size:13px; font-weight:500; color:var(--text-2); margin-bottom:8px; }
  .field{
    display:flex; align-items:center; gap:10px;
    padding:0 14px; height:44px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:12px;
    transition:border-color .2s var(--ease);
  }
  .field:focus-within{ border-color:var(--accent-border); }
  .field svg{ width:15px; height:15px; color:var(--text-3); flex:none; }
  .field input{
    flex:1; min-width:0;
    background:transparent; border:none; outline:none;
    font:inherit; font-size:14px; color:var(--text);
  }
  .field input::placeholder{ color:var(--text-3); }
  .field-hint{ font-size:12.5px; color:var(--text-3); margin-top:8px; }
  .field-hint a{ color:var(--accent-2); text-decoration:none; }
  .field-hint a:hover{ text-decoration:underline; }

  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
  .btn-ghost{
    height:37px; padding:0 16px;
    font:inherit; font-size:14px; font-weight:500;
    color:var(--text-2);
    background:transparent;
    border:1px solid var(--border);
    border-radius:12px; cursor:pointer;
    transition:all .2s var(--ease);
    display:inline-flex; align-items:center;
  }
  .btn-ghost:hover{ color:var(--text); background:var(--glass-strong); }

  /* ============================== АДАПТИВ ============================== */
  @media (max-width:640px){
    .topbar{ padding:10px 14px; }
    .brand-name{ font-size:15px; }
    .btn-primary{ padding:0 12px; }
    .btn-primary .btn-label{ display:none; }   /* «Новая сессия» → только иконка */

    .model-bar{ padding:10px 14px 2px; gap:6px; justify-content:flex-start; }
    .model-pill{ padding:6px 13px; font-size:13px; }

    .chat{ padding:16px 14px 22px; }
    .welcome h1{ font-size:23px; }
    .welcome-logo{ width:58px; height:58px; border-radius:17px; }
    .welcome-logo svg{ width:28px; height:28px; }
    .quick-prompts{ grid-template-columns:1fr; }

    .msg.user .msg-body{ max-width:88%; }

    .composer{ padding:8px 12px 10px; }
    .composer-hint{ font-size:11px; }
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
    .chat{ scroll-behavior:auto; }
  }
</style>
</head>
<body>

<!-- Переключатель модалки настроек (checkbox-хак, JS не нужен) -->
<input type="checkbox" id="settings-toggle" class="visually-hidden">

<div class="app">

  <!-- ==================== ШАПКА ==================== -->
  <header class="topbar">
    <!-- Выбор модели: открывает bottom sheet -->
    <button class="model-picker" id="model-picker" type="button" title="Выбор модели" aria-haspopup="dialog" aria-expanded="false" aria-controls="model-sheet">
      <span class="model-picker-name" id="model-picker-name">Nemotron 3 Ultra</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
    </button>

    <a class="brand brand--hidden" href="#">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.9 5.7a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"/>
        </svg>
      </span>
      <span class="brand-name">Lunox<span> AI</span></span>
    </a>

    <div class="topbar-actions">
      <!-- Настройки (API-ключ) — открывает модалку -->
      <label for="settings-toggle" class="icon-btn" title="Настройки API" role="button" tabindex="0" aria-label="Настройки API">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
        </svg>
      </label>
      <!-- [JS] Очистка истории -->
      <button class="icon-btn danger" type="button" title="Очистить историю" aria-label="Очистить историю">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          <line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
        </svg>
      </button>
      <!-- [JS] Новая сессия -->
      <button class="btn-primary" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span class="btn-label">Новая сессия</span>
      </button>
    </div>
  </header>

  <!-- ====== СТАРЫЕ ТАБЛЕТКИ (скрыты .pill--hidden, оставлены на будущее; слаги в JS не используются) ====== -->
  <div class="model-bar pill--hidden" role="radiogroup" aria-label="Выбор модели">
    <input class="pill--hidden" type="radio" name="model" id="m-deepseek" checked>
    <label class="model-pill pill--hidden" for="m-deepseek">DeepSeek</label>

    <input class="pill--hidden" type="radio" name="model" id="m-gemini">
    <label class="model-pill pill--hidden" for="m-gemini">Gemini</label>

    <input class="pill--hidden" type="radio" name="model" id="m-qwen">
    <label class="model-pill pill--hidden" for="m-qwen">Qwen</label>

    <input class="pill--hidden" type="radio" name="model" id="m-llama">
    <label class="model-pill pill--hidden" for="m-llama">Llama</label>

    <input class="pill--hidden" type="radio" name="model" id="m-mistral">
    <label class="model-pill pill--hidden" for="m-mistral">Mistral</label>
  </div>

  <!-- ==================== ИСТОРИЯ ЧАТА ==================== -->
  <main class="chat" id="chat">

    <!-- Приветствие при пустом чате.
         [JS] Скрывать (класс .is-hidden), когда в ленте есть сообщения. -->
    <section class="welcome" id="welcome">
      <div class="welcome-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.9 5.7a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"/>
        </svg>
      </div>
      <h1>Чем <em>помочь</em>?</h1>
      <p class="welcome-sub">Спросите что угодно — Lunox подключён к бесплатным моделям через OpenRouter.</p>

      <!-- Быстрые запросы -->
      <div class="quick-prompts">
        <button class="quick-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
          </svg>
          <span><b>Написать код</b><small>Функция сортировки на Python с тестами</small></span>
        </button>
        <button class="quick-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
          <span><b>Отредактировать текст</b><small>Сделать письмо короче и убедительнее</small></span>
        </button>
        <button class="quick-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <span><b>Объяснить простыми словами</b><small>Как работают трансформеры в ИИ</small></span>
        </button>
        <button class="quick-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
          <span><b>Быстрый брейншторм</b><small>10 идей названия для кофейни</small></span>
        </button>
      </div>
    </section>

    <!-- Лента сообщений: заполняется скриптом -->
    <div class="messages is-hidden" id="messages" aria-live="polite"></div>
  </main>

  <!-- ==================== ПОЛЕ ВВОДА ==================== -->
  <footer class="composer">
    <div class="composer-inner">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="Сообщение для Lunox…" aria-label="Сообщение для Lunox"></textarea>
        <div class="composer-actions">
          <!-- Кнопка «Стоп»: [JS] показывать во время генерации, скрывая .send-btn -->
          <button class="stop-btn is-hidden" type="button" title="Остановить генерацию" aria-label="Остановить генерацию">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round">
              <rect x="6" y="6" width="12" height="12" rx="2.5"/>
            </svg>
          </button>
          <!-- [JS] Отправка сообщения -->
          <button class="send-btn" type="button" title="Отправить" aria-label="Отправить сообщение">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
        </div>
      </div>
      <p class="composer-hint">Lunox может ошибаться — проверяйте важную информацию.</p>
    </div>
  </footer>

</div><!-- /.app -->

<!-- ==================== МОДАЛКА: НАСТРОЙКИ API ==================== -->
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <label for="settings-toggle" class="modal-overlay" aria-label="Закрыть"></label>
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="settings-title">Настройки</h2>
      <label for="settings-toggle" class="icon-btn" role="button" tabindex="0" aria-label="Закрыть настройки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </label>
    </div>

    <label class="field-label" for="api-key">API-ключ OpenRouter</label>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <input type="password" id="api-key" placeholder="sk-or-…" autocomplete="off" spellcheck="false">
    </div>
    <p class="field-hint">Ключ хранится только в вашем браузере. Получить: <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a></p>

    <div class="modal-actions">
      <label for="settings-toggle" class="btn-ghost" role="button" tabindex="0">Отмена</label>
      <!-- [JS] Сохранение ключа (localStorage / state) -->
      <button class="btn-primary" type="button">Сохранить</button>
    </div>
  </div>
</div>

<!-- ==================== BOTTOM SHEET: ВЫБОР МОДЕЛИ ==================== -->
<div class="sheet" id="model-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-overlay" id="sheet-overlay"></div>
  <div class="sheet-panel" id="sheet-panel" tabindex="-1">
    <div class="sheet-drag">
      <span class="sheet-handle" aria-hidden="true"></span>
      <h2 class="sheet-title" id="sheet-title">Выбор модели</h2>
    </div>
    <div class="field sheet-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search" id="model-search" placeholder="Поиск модели" aria-label="Поиск модели" autocomplete="off" spellcheck="false">
    </div>
    <ul class="sheet-list" id="model-list" role="listbox" aria-label="Модели"></ul>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- хранилище ---------- */
  var LS_KEY = 'openrouter_key', LS_MODEL = 'active_model', LS_HIST = 'lunox_ai_history';
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function $(s) { return document.querySelector(s); }

  /* ---------- модели (bottom sheet) ---------- */
  /* Слаги: openrouter.ai/models, фильтр Free, сверено 2026-10-02. Chat only. */
  var MODELS = [
    { name: 'Nemotron 3 Ultra',       slug: 'nvidia/nemotron-3-ultra-550b-a55b:free',    desc: 'Флагман NVIDIA, 550B, контекст 1M' },
    { name: 'Nemotron 3 Super',       slug: 'nvidia/nemotron-3-super-120b-a12b:free',    desc: '120B MoE для агентов и рассуждений' },
    { name: 'Nemotron 3.5 Lightning', slug: 'nvidia/nemotron-3.5-lightning:free',        desc: 'Быстрая MoE 30B, 3B активных' },
    { name: 'Nemotron 3 Nano Omni',   slug: 'nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free', desc: 'Мультимодальная 30B-A3B с рассуждением' },
    { name: 'Qwen 3.8 27B',           slug: 'qwen/qwen3.8-27b:free',                     desc: 'Vision-language модель, код и агенты' },
    { name: 'Gemma 4 31B',            slug: 'google/gemma-4-31b-it:free',                desc: 'Google, 31B, 140+ языков, контекст 256K' },
    { name: 'Gemma 4 26B A4B',        slug: 'google/gemma-4-26b-a4b-it:free',            desc: 'Google MoE, 3.8B активных, быстрая' },
    { name: 'Llama 3.3 70B',          slug: 'meta-llama/llama-3.3-70b-instruct:free',    desc: 'Meta, 70B, диалог на 8 языках' }, /* нет в списке Free на 2026-10-02: вероятен 404 */
    { name: 'Apodex 1.1 Mini',        slug: 'apodex/apodex-1.1-mini:free',               desc: 'Рассуждения для исследований и прогнозов' },
    { name: 'Inkling Small',          slug: 'thinkingmachines/inkling-small:free',       desc: 'Мультимодальная MoE, 12B активных' },
    { name: 'Inkling',                slug: 'thinkingmachines/inkling:free',             desc: 'Мультимодальная MoE, 41B активных' },
    { name: 'Ling 3.0 Flash Sante',   slug: 'inclusionai/ling-3.0-flash-sante:free',     desc: 'Медицинская MoE от inclusionAI' },
    { name: 'North Mini Code',        slug: 'cohere/north-mini-code:free',               desc: 'Агентная модель для кода от Cohere' },
    { name: 'Laguna S 2.1',           slug: 'poolside/laguna-s-2.1:free',                desc: 'Кодовый агент Poolside, 118B' },
    { name: 'Laguna XS 2.1',          slug: 'poolside/laguna-xs-2.1:free',               desc: 'Компактный кодовый агент Poolside' },
    { name: 'Dots3-Note Preview',     slug: 'dots-studio/dots-3-note-preview:free',      desc: 'Лёгкая MoE семейства Dots 3, 512K' },
    { name: 'LFM2.5-2.6B',            slug: 'liquid/lfm-2.5-2.6b:free',                  desc: 'Компактная модель Liquid AI, 2.6B' },
    { name: 'Mercury Decide',         slug: 'inception/mercury-decide:free',             desc: 'Модель решений, не для диалога' },
    { name: 'Span-01 Lite',           slug: 'respan/span-01-lite:free',                  desc: 'Оценка поведения, не для диалога' }
  ];
  var DEFAULT_MODEL = MODELS[0].slug;
  var activeSlug = DEFAULT_MODEL;

  function bySlug(slug) {
    for (var i = 0; i < MODELS.length; i++) if (MODELS[i].slug === slug) return MODELS[i];
    return null;
  }
  function activeModel() { return activeSlug; }
  function modelName(slug) {
    var m = bySlug(slug);
    return m ? m.name : (slug ? String(slug).split('/').pop().replace(/:free$/, '') : 'Lunox');
  }

  var pickerBtn = $('#model-picker'), pickerName = $('#model-picker-name');
  var sheet = $('#model-sheet'), panel = $('#sheet-panel'), list = $('#model-list'), search = $('#model-search');
  var lastFocus = null, drag = null;
  var ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';

  /* Устаревший слаг из старой сборки -> модель по умолчанию */
  function setActive(slug) {
    var m = bySlug(slug) || bySlug(DEFAULT_MODEL);
    activeSlug = m.slug; lsSet(LS_MODEL, m.slug);
    pickerName.textContent = m.name;
  }
  setActive(lsGet(LS_MODEL));

  function renderList() {
    var q = search.value.trim().toLowerCase(), n = 0;
    list.textContent = '';
    MODELS.forEach(function (m) {
      if (q && (m.name + ' ' + m.desc + ' ' + m.slug).toLowerCase().indexOf(q) < 0) return;
      n++;
      var li = el('li'), b = el('button', 'model-card'), t = el('span', 'model-card-text'), c = el('span', 'model-card-check');
      li.setAttribute('role', 'presentation');
      b.type = 'button'; b.title = m.desc;
      b.setAttribute('role', 'option');
      b.setAttribute('data-slug', m.slug);
      b.setAttribute('aria-selected', m.slug === activeSlug ? 'true' : 'false');
      t.appendChild(el('span', 'model-card-name', m.name));
      t.appendChild(el('span', 'model-card-desc', m.desc));
      c.innerHTML = ICON_CHECK;
      b.appendChild(t); b.appendChild(c); li.appendChild(b); list.appendChild(li);
    });
    if (!n) list.appendChild(el('li', 'sheet-empty', 'Ничего не найдено'));
  }

  /* Клавиатура на мобильных: поднимаем шторку над ней */
  function fitSheet() {
    var vv = window.visualViewport;
    if (!vv || !sheet.classList.contains('is-open')) return;
    var zoomed = vv.scale && vv.scale > 1.01;
    sheet.style.setProperty('--kb', zoomed ? '0px' : Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) + 'px');
    sheet.style.setProperty('--vvh', zoomed ? '100dvh' : Math.round(vv.height) + 'px');
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitSheet);
    window.visualViewport.addEventListener('scroll', fitSheet);
  }

  function openSheet() {
    if (sheet.classList.contains('is-open')) return;
    lastFocus = document.activeElement;
    search.value = ''; renderList();
    sheet.classList.add('is-open');
    pickerBtn.setAttribute('aria-expanded', 'true');
    fitSheet();
    var act = list.querySelector('[aria-selected="true"]');
    if (act) list.scrollTop = act.getBoundingClientRect().top - list.getBoundingClientRect().top + list.scrollTop - 8;
    var fine = window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches;
    setTimeout(function () { (fine ? search : panel).focus({ preventScroll: true }); }, 60);
  }
  function closeSheet() {
    if (!sheet.classList.contains('is-open')) return;
    sheet.classList.remove('is-open');
    pickerBtn.setAttribute('aria-expanded', 'false');
    search.blur();
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }

  pickerBtn.addEventListener('click', openSheet);
  $('#sheet-overlay').addEventListener('click', closeSheet);
  search.addEventListener('input', renderList);
  search.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); var f = list.querySelector('.model-card'); if (f) f.click(); }
  });
  list.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.model-card') : null;
    if (!b) return;
    setActive(b.getAttribute('data-slug'));
    [].forEach.call(list.querySelectorAll('.model-card'), function (x) { x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
    setTimeout(closeSheet, 140);
  });

  /* Фокус не уходит за пределы шторки */
  panel.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return;
    var f = panel.querySelectorAll('input, button');
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1], a = document.activeElement;
    if (e.shiftKey && (a === first || a === panel)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
  });

  /* Свайп вниз: с заголовка или со списка, когда он прокручен к началу */
  panel.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1 || e.target === search) return;
    drag = { y: e.touches[0].clientY, t: Date.now(), dy: 0, on: false, inList: list.contains(e.target) };
  }, { passive: true });
  panel.addEventListener('touchmove', function (e) {
    if (!drag) return;
    var dy = e.touches[0].clientY - drag.y;
    if (!drag.on) {
      if (dy > 8 && (!drag.inList || list.scrollTop <= 0)) { drag.on = true; panel.classList.add('is-dragging'); }
      else { if (dy < -8 || (drag.inList && list.scrollTop > 0)) drag = null; return; }
    }
    if (e.cancelable) e.preventDefault();
    drag.dy = Math.max(0, dy);
    panel.style.transform = 'translateY(' + drag.dy + 'px)';
  }, { passive: false });
  function endDrag() {
    if (!drag) return;
    var d = drag; drag = null;
    if (!d.on) return;
    panel.classList.remove('is-dragging'); panel.style.transform = '';
    if (d.dy > 110 || d.dy / Math.max(1, Date.now() - d.t) > 0.55) closeSheet();
  }
  panel.addEventListener('touchend', endDrag);
  panel.addEventListener('touchcancel', endDrag);

  /* ---------- модалка API-ключа ---------- */
  var toggle = $('#settings-toggle'), keyInput = $('#api-key'), saveBtn = $('.modal-actions .btn-primary');

  function getKey() { return (lsGet(LS_KEY) || '').trim(); }
  function maskKey(k) { return k.length > 12 ? k.slice(0, 6) + '••••••••' + k.slice(-4) : '••••••••'; }

  function syncModal() {
    keyInput.value = '';
    if (toggle.checked) {
      var k = getKey();
      keyInput.placeholder = k ? maskKey(k) : 'sk-or-…';
      setTimeout(function () { keyInput.focus(); }, 80);
    }
  }
  function openModal() { toggle.checked = true; syncModal(); }
  function closeModal() { toggle.checked = false; syncModal(); }

  toggle.addEventListener('change', syncModal);
  saveBtn.addEventListener('click', function () {
    var v = keyInput.value.trim();
    if (v) { lsSet(LS_KEY, v); closeModal(); }
    else if (getKey()) { closeModal(); }
    else { keyInput.focus(); }
  });
  keyInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); saveBtn.click(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheet.classList.contains('is-open')) { closeSheet(); return; }
    if (e.key === 'Escape' && toggle.checked) { closeModal(); return; }
    var t = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && t && t.matches && t.matches('label[role="button"]')) {
      e.preventDefault();
      t.click();
    }
  });

  /* ---------- история и запрос ---------- */
  var API_URL = 'https://openrouter.ai/api/v1/chat/completions';
  var MAX_STORE = 100, MAX_CTX = 20;
  var input = $('#input'), sendBtn = $('.send-btn'), stopBtn = $('.stop-btn');
  var hist = loadHist(), busy = false, ctrl = null, reqId = 0;

  function loadHist() {
    try {
      var a = JSON.parse(lsGet(LS_HIST) || '[]');
      if (!Array.isArray(a)) return [];
      return a.filter(function (m) {
        return m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string' && m.content;
      });
    } catch (e) { return []; }
  }
  function saveHist() {
    if (hist.length > MAX_STORE) hist = hist.slice(-MAX_STORE);
    lsSet(LS_HIST, JSON.stringify(hist));
  }

  function autosize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 180) + 'px';
  }
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      send();
    }
  });
  sendBtn.addEventListener('click', send);

  function send() {
    if (busy) return;
    var text = input.value.trim();
    if (!text) return;
    if (!getKey()) { openModal(); return; }
    removeErrors();
    var m = { role: 'user', content: text, ts: Date.now() };
    hist.push(m); saveHist();
    input.value = ''; autosize();
    appendMsg(m, hist.length - 1);
    request();
  }

  function request() {
    var id = ++reqId, model = activeModel();
    ctrl = new AbortController();
    setBusy(true); showTyping();
    var msgs = hist.slice(-MAX_CTX).map(function (m) { return { role: m.role, content: m.content }; });

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + getKey(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: model, messages: msgs }),
      signal: ctrl.signal
    }).then(function (res) {
      return res.text().then(function (t) {
        var data = null; try { data = JSON.parse(t); } catch (e) {}
        return { status: res.status, ok: res.ok, data: data };
      });
    }).then(function (r) {
      if (id !== reqId) return;
      if (!r.ok) return fail(r.status, r.data);
      var d = r.data;
      if (d && d.error) return fail(+d.error.code || 500, d);
      var c = d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
      if (typeof c !== 'string' || !c.trim()) return fail('empty', d);
      ctrl = null; removeTyping(); setBusy(false);
      var m = { role: 'assistant', content: c, model: model, ts: Date.now() };
      hist.push(m); saveHist();
      appendMsg(m, hist.length - 1);
    }).catch(function (err) {
      if (id !== reqId) return;
      if (err && err.name === 'AbortError') {
        ctrl = null; removeTyping(); setBusy(false); rollback();
        return;
      }
      fail(err instanceof TypeError ? 'network' : 'unknown', null);
    });
  }

  /* Неудачный запрос: убираем вопрос из истории и возвращаем текст в поле ввода */
  function rollback() {
    var last = hist[hist.length - 1];
    if (last && last.role === 'user') {
      hist.pop(); saveHist();
      input.value = last.content + (input.value.trim() ? '\n' + input.value : '');
      autosize();
    }
    render();
  }

  function fail(status, data) {
    ctrl = null; removeTyping(); setBusy(false);
    rollback();
    showError(errText(status, data));
    if (status === 401) openModal();
  }

  function errText(s, data) {
    if (s === 401) return 'Неверный API-ключ';
    if (s === 429) return 'Лимит, попробуйте позже';
    if (typeof s === 'number' && s >= 500) return 'Сервер недоступен';
    if (s === 402) return 'Недостаточно кредитов на OpenRouter';
    if (s === 404) return 'Модель недоступна, выберите другую';
    if (s === 'network') return 'Нет соединения с интернетом';
    if (s === 'empty') return 'Пустой ответ, попробуйте ещё раз';
    var msg = data && data.error && data.error.message;
    return 'Ошибка запроса' + (typeof s === 'number' ? ' (' + s + ')' : '') + (msg ? ': ' + String(msg).slice(0, 160) : '');
  }

  /* ---------- рендер ---------- */
  var chat = $('#chat'), welcome = $('#welcome'), feed = $('#messages');
  var typingNode = null;
  var AVATAR = '<div class="msg-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.7a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"/></svg></div>';

  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }
  function timeLabel(ts) {
    try { return new Date(ts || Date.now()).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); }
    catch (e) { return ''; }
  }

  /* Текст -> абзацы и блоки кода (```), всё через textContent */
  function renderText(text, parent) {
    text.replace(/\r/g, '').split('```').forEach(function (part, i) {
      if (i % 2 === 1) {
        var nl = part.indexOf('\n'), code = part;
        if (nl > -1 && /^[\w+#.\-]*$/.test(part.slice(0, nl).trim())) code = part.slice(nl + 1);
        var pre = el('pre'), c = el('code', null, code.replace(/\n$/, ''));
        pre.appendChild(c); parent.appendChild(pre);
      } else {
        part.split(/\n{2,}/).forEach(function (chunk) {
          if (!chunk.trim()) return;
          var p = el('p');
          chunk.replace(/^\n+|\n+$/g, '').split('\n').forEach(function (line, j) {
            if (j) p.appendChild(document.createElement('br'));
            p.appendChild(document.createTextNode(line));
          });
          parent.appendChild(p);
        });
      }
    });
  }

  function userNode(m) {
    var n = el('div', 'msg user'), body = el('div', 'msg-body'), b = el('div', 'bubble');
    renderText(m.content, b);
    body.appendChild(b); n.appendChild(body);
    return n;
  }

  var ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  var ICON_REGEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>';
  function actionsNode(idx) {
    var box = el('div', 'msg-actions');
    box.innerHTML =
      '<button class="msg-action" type="button" title="Копировать ответ" data-act="copy" data-i="' + idx + '">' + ICON_COPY + ' Копировать</button>' +
      (idx === hist.length - 1
        ? '<button class="msg-action" type="button" title="Повторить генерацию" data-act="regen" data-i="' + idx + '">' + ICON_REGEN + ' Заново</button>'
        : '');
    return box;
  }

  function aiNode(m, idx) {
    var n = el('div', 'msg ai'), body = el('div', 'msg-body'), meta = el('div', 'msg-meta'), bub = el('div', 'bubble');
    n.insertAdjacentHTML('afterbegin', AVATAR);
    meta.appendChild(el('b', null, modelName(m.model)));
    meta.appendChild(el('span', null, '·'));
    meta.appendChild(el('span', null, timeLabel(m.ts)));
    renderText(m.content, bub);
    body.appendChild(meta); body.appendChild(bub);
    body.appendChild(actionsNode(idx));
    n.appendChild(body);
    return n;
  }

  function showFeed() { welcome.classList.add('is-hidden'); feed.classList.remove('is-hidden'); }
  function scrollDown() { requestAnimationFrame(function () { chat.scrollTop = chat.scrollHeight; }); }

  function appendMsg(m, idx) {
    showFeed();
    [].forEach.call(feed.querySelectorAll('[data-act="regen"]'), function (b) { b.parentNode.removeChild(b); });
    feed.appendChild(m.role === 'user' ? userNode(m) : aiNode(m, idx));
    scrollDown();
  }

  function render() {
    feed.textContent = '';
    hist.forEach(function (m, i) { feed.appendChild(m.role === 'user' ? userNode(m) : aiNode(m, i)); });
    var has = hist.length > 0;
    welcome.classList.toggle('is-hidden', has);
    feed.classList.toggle('is-hidden', !has);
    if (has) scrollDown();
  }

  function showTyping() {
    showFeed();
    typingNode = el('div', 'msg ai');
    typingNode.innerHTML = AVATAR +
      '<div class="msg-body"><div class="typing" role="status" aria-label="Модель печатает ответ">' +
      '<span class="typing-dots"><i></i><i></i><i></i></span><span class="typing-text">Lunox печатает…</span></div></div>';
    feed.appendChild(typingNode);
    scrollDown();
  }
  function removeTyping() {
    if (typingNode && typingNode.parentNode) typingNode.parentNode.removeChild(typingNode);
    typingNode = null;
  }

  function showError(text) {
    showFeed();
    var n = el('div', 'msg ai'), body = el('div', 'msg-body'), bub = el('div', 'bubble');
    n.setAttribute('data-error', '1');
    n.insertAdjacentHTML('afterbegin', AVATAR);
    bub.appendChild(el('p', null, text));
    body.appendChild(bub); n.appendChild(body);
    feed.appendChild(n);
    scrollDown();
  }
  function removeErrors() {
    [].forEach.call(feed.querySelectorAll('[data-error]'), function (e) { e.parentNode.removeChild(e); });
  }

  function setBusy(b) {
    busy = b;
    sendBtn.classList.toggle('is-hidden', b);
    stopBtn.classList.toggle('is-hidden', !b);
  }
  stopBtn.addEventListener('click', function () { if (ctrl) ctrl.abort(); });

  render();

  /* ---------- кнопки ---------- */
  function reset() {
    reqId++;
    if (ctrl) { ctrl.abort(); ctrl = null; }
    removeTyping(); setBusy(false);
    hist = []; lsDel(LS_HIST);
    render();
  }
  $('.topbar-actions .btn-primary').addEventListener('click', function () { reset(); input.focus(); });
  $('.icon-btn.danger').addEventListener('click', function () {
    if (hist.length && !window.confirm('Очистить историю чата?')) return;
    reset();
  });

  [].forEach.call(document.querySelectorAll('.quick-btn'), function (b) {
    b.addEventListener('click', function () {
      var small = b.querySelector('small').textContent;
      input.value = b.querySelector('b').textContent + ': ' + small.charAt(0).toLowerCase() + small.slice(1);
      autosize(); input.focus();
    });
  });

  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
    return new Promise(function (res, rej) {
      var ta = document.createElement('textarea');
      ta.value = t; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? res() : rej(); } catch (e) { rej(e); }
      document.body.removeChild(ta);
    });
  }
  function flash(btn) {
    var t = btn.lastChild, old = t.nodeValue;
    t.nodeValue = ' Скопировано';
    setTimeout(function () { t.nodeValue = old; }, 1500);
  }
  function regenerate() {
    if (busy) return;
    if (!getKey()) { openModal(); return; }
    if (!hist.length || hist[hist.length - 1].role !== 'assistant') return;
    removeErrors(); hist.pop(); saveHist(); render(); request();
  }
  feed.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.msg-action') : null;
    if (!b) return;
    if (b.getAttribute('data-act') === 'copy') {
      var m = hist[+b.getAttribute('data-i')];
      if (m) copyText(m.content).then(function () { flash(b); }, function () {});
    } else if (b.getAttribute('data-act') === 'regen') {
      regenerate();
    }
  });
})();
</script>

</body>
</html>
